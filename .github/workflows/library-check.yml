name: 図書館状況チェック

on:
  schedule:
    - cron: '0 23 * * *'    # 8:00 JST (UTC 23:00)
    - cron: '0 0-11 * * *'  # 9:00〜20:00 JST (UTC 0〜11:00)
  workflow_dispatch:         # GitHub画面から手動実行も可能

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 失敗時に残ったartifactを削除するために必要

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: library-traverse
        run: uv sync

      - name: Install Playwright Chromium
        working-directory: library-traverse
        run: uv run playwright install chromium --with-deps

      - name: Create config.yaml from secret
        working-directory: library-traverse
        env:
          CONFIG: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG" > config.yaml

      - name: Run library check
        working-directory: library-traverse
        run: uv run library-traverse --detail --html _site/index.html
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: library-traverse/_site

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Clean up stale artifact if all deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "3回とも失敗したため、次回実行に影響しないようartifactを削除します"
          ARTIFACT_IDS=$(gh api "/repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id')
          for id in $ARTIFACT_IDS; do
            echo "deleting artifact id=$id"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
          exit 1
