name: 大和 新システム調査（一時）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: library-traverse
        run: uv sync
      - working-directory: library-traverse
        run: uv run playwright install chromium --with-deps
      - working-directory: library-traverse
        env:
          CONFIG: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG" > config.yaml
      - working-directory: library-traverse
        run: uv run python debug_yamato_new.py
